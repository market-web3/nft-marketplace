version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nft-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nft_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Apache Kafka for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nft-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nft-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ScyllaDB for high-performance write operations
  scylladb:
    image: scylladb/scylla:5.2.0
    container_name: nft-scylladb
    ports:
      - "9042:9042"
    volumes:
      - scylladb_data:/var/lib/scylla
    command: --developer-mode 1

  # IPFS Node for decentralized storage
  ipfs:
    image: ipfs/kubo:latest
    container_name: nft-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nft-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nft_marketplace
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ../backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nft-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev

  # Admin Panel
  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    container_name: nft-admin
    environment:
      ADMIN_API_URL: http://backend:3001
    ports:
      - "3003:3003"
    depends_on:
      - backend
    volumes:
      - ../admin-panel:/app
      - /app/node_modules
    command: npm run dev

  # Telegram Bot
  telegram-bot:
    build:
      context: ../telegram-bot
      dockerfile: Dockerfile
    container_name: nft-telegram-bot
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:3001
    depends_on:
      - redis
      - backend
    volumes:
      - ../telegram-bot:/app
      - /app/node_modules
    command: npm run dev

  # Rust Indexer
  indexer:
    build:
      context: ../indexer
      dockerfile: Dockerfile
    container_name: nft-indexer
    environment:
      INDEXER__TON_API_URL: https://toncenter.com/api/v2
      INDEXER__START_BLOCK_SEQNO: 0
      INDEXER__POLL_INTERVAL_MS: 1000
      INDEXER__KAFKA__BOOTSTRAP_SERVERS: kafka:29092
      INDEXER__SCYLLA__NODES: scylladb:9042
    depends_on:
      - kafka
      - scylladb
    ports:
      - "9090:9090"
    volumes:
      - ../indexer:/app
      - indexer_logs:/app/logs

  # AI Embeddings Service
  embeddings-service:
    build:
      context: ../ai-services/embeddings
      dockerfile: Dockerfile
    container_name: nft-embeddings
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nft_marketplace
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"
    volumes:
      - ../ai-services/embeddings:/app

  # AI Trust Engine
  trust-engine:
    build:
      context: ../ai-services/trust-engine
      dockerfile: Dockerfile
    container_name: nft-trust-engine
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nft_marketplace
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8002:8002"
    volumes:
      - ../ai-services/trust-engine:/app
      - trust_models:/app/models

  # Gasless Relayer
  relayer:
    build:
      context: ../relayer
      dockerfile: Dockerfile
    container_name: nft-relayer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nft_marketplace
      REDIS_URL: redis://redis:6379
      TON_API_URL: https://toncenter.com/api/v2
      PORT: 3005
    depends_on:
      - postgres
      - redis
    ports:
      - "3005:3005"
    volumes:
      - ../relayer:/app
      - relayer_logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  zookeeper_data:
  scylladb_data:
  ipfs_data:
  indexer_logs:
  trust_models:
  relayer_logs:
