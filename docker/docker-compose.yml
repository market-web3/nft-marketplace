version: '3.8'

services:
  # API Gateway / Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
    depends_on:
      - api
      - frontend
    networks:
      - nft-marketplace
    restart: unless-stopped

  # API Server (Multiple instances for load balancing)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/nft_marketplace
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
      - TON_API_KEY=${TON_API_KEY}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nft-marketplace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gateway Server (WebSocket)
  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile.gateway
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=3001
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - redis
      - rabbitmq
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Background Workers
  workers:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/nft_marketplace
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - TON_API_KEY=${TON_API_KEY}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
      - GATEWAY_URL=ws://gateway:3001
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Admin Panel
  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Telegram Bot
  telegram-bot:
    build:
      context: ../telegram-bot
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://api:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - nft-marketplace
    restart: unless-stopped

  # PostgreSQL (Primary)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=nft_marketplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - nft-marketplace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (Read Replica)
  postgres-replica:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=nft_marketplace
      - PGUSER=replica
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Redis (Primary)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - nft-marketplace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Sentinel for HA)
  redis-sentinel:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - nft-marketplace
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-alpine-management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nft-marketplace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - nft-marketplace
    restart: unless-stopped

  # Certbot (SSL)
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nft-marketplace
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  certbot-data:
  certbot-www:

networks:
  nft-marketplace:
    driver: bridge
