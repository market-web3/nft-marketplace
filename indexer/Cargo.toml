[package]
name = "ton-nft-indexer"
version = "0.1.0"
edition = "2021"
authors = ["TON NFT Marketplace Team"]

[dependencies]
# TON Blockchain
ton-core = { git = "https://github.com/ton-blockchain/ton", tag = "v2024.1" }
ton-blockchain = { git = "https://github.com/ton-blockchain/ton", tag = "v2024.1" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.74"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Database
scylla = "0.11.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
postgres-protocol = "0.6"

# Apache Kafka
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
toml = "0.8"

# Metrics & Monitoring
prometheus = "0.13"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.21"
url = "2.5"
reqwest = { version = "0.11", features = ["json"] }

# Blockchain parsing
ed25519-dalek = "2.0"
blst = "0.3"

# Caching
moka = { version = "0.12", features = ["future"] }

# Rate limiting
governor = "0.6"

[dev-dependencies]
mockall = "0.12"
tempfile = "3.8"

[[bin]]
name = "indexer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
